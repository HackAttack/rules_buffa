# Publish new releases to the Bazel Central Registry.
name: Publish to BCR
on:
  # Called by release.yaml after a successful release.
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  # Lets a maintainer retry a failed publish from the GitHub UI.
  workflow_dispatch:
    inputs:
      tag_name:
        description: git tag being released
        required: true
        type: string
jobs:
  publish:
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.4.2
    with:
      tag_name: ${{ inputs.tag_name }}
      # The fork of the BCR the pull request is opened from.
      registry_fork: HackAttack/bazel-central-registry
      draft: false
      attest: true
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets:
      # Pushes to the BCR fork and opens the pull request.
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
