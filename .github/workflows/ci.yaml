name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # The rules_rust version in MODULE.bazel is the oldest supported one.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bazel: [7.x, 8.x, 9.x]
    runs-on: ${{ matrix.os }}
    name: Bazel ${{ matrix.bazel }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true
      - name: bazel test //...
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
        shell: bash
        # A short output root keeps Windows paths under MAX_PATH.
        run: >-
          bazel ${{ runner.os == 'Windows' && '--output_user_root=C:/b' || '' }}
          --bazelrc=.github/workflows/ci.bazelrc
          test --config=rustfmt --config=clippy //...

  # The rules load private rules_rust APIs, so any rules_rust release can
  # break them.
  rules_rust_latest:
    name: Latest rules_rust release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: rules-rust-latest
          repository-cache: true
      - name: Depend on the latest rules_rust release
        shell: bash
        run: |
          version="$(curl -fsSL https://bcr.bazel.build/modules/rules_rust/metadata.json | jq -r '.versions[-1]')"
          sed -i "s/bazel_dep(name = \"rules_rust\", version = \"[^\"]*\")/bazel_dep(name = \"rules_rust\", version = \"${version}\")/" MODULE.bazel
          grep -F "bazel_dep(name = \"rules_rust\", version = \"${version}\")" MODULE.bazel
      - name: bazel test //...
        run: bazel --bazelrc=.github/workflows/ci.bazelrc test --config=rustfmt --config=clippy //...

  # Early warning of rules_rust changes that will break the next release.
  rules_rust_main:
    name: rules_rust main
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          path: rules_buffa
      - uses: actions/checkout@v6
        with:
          repository: bazelbuild/rules_rust
          path: rules_rust
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: rules-rust-main
          repository-cache: true
      - name: bazel test //...
        working-directory: rules_buffa
        run: >-
          bazel --bazelrc=.github/workflows/ci.bazelrc
          test --config=rustfmt --config=clippy
          --override_module=rules_rust="${GITHUB_WORKSPACE}/rules_rust"
          //...
